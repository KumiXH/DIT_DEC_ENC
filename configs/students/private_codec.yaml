# Fill the builder and runner functions in private_codec/entrypoints.py.
components:
  student_encoder:
    backend: external
    factory: private_codec.factories:create_encoder
    checkpoint: null
    teacher_reference: auto
    kwargs:
      builder: private_codec.entrypoints:build_encoder
      runner: private_codec.entrypoints:run_encoder
      builder_kwargs: {}
      runner_kwargs: {}
    adapter:
      kind: encoder
      input_mode: rgb
      latent_temporal_frames: teacher

  # Legacy unconditional decoder used by the Wan decoder/autoencoder examples.
  student_decoder:
    backend: external
    factory: private_codec.factories:create_decoder
    checkpoint: null
    kwargs:
      module_path: private_codec.wrapped_network
      class_name: YourWrappedNetwork
      init_kwargs: {}
    adapter:
      kind: decoder
      output_mode: sparse_yuv

  conditional_student_decoder:
    backend: external
    factory: private_codec.factories:create_conditional_decoder
    checkpoint: null
    teacher_reference: auto
    kwargs:
      builder: private_codec.entrypoints:build_decoder
      runner: private_codec.entrypoints:run_decoder
      builder_kwargs: {}
      runner_kwargs: {}
    adapter:
      kind: decoder
      output_mode: rgb
      accepts_condition: true
