# Runnable v0 defaults. Copy versions/v0 to versions/v1 for a private replacement.
components:
  student_encoder:
    backend: external
    factory: private_codec.factories:create_encoder
    checkpoint: null
    teacher_reference: auto
    kwargs:
      builder: private_codec.versions.v0.entrypoints:build_encoder
      runner: private_codec.versions.v0.entrypoints:run_encoder
      builder_kwargs: {}
      runner_kwargs: {}
    adapter:
      kind: encoder
      input_mode: rgb
      latent_temporal_frames: teacher

  # Legacy unconditional decoder used by the Wan decoder/autoencoder examples.
  student_decoder:
    backend: external
    factory: private_codec.factories:create_decoder
    checkpoint: null
    kwargs:
      module_path: private_codec.versions.v0.wrapped_network
      class_name: V0UnconditionalDecoder
      init_kwargs: {}
    adapter:
      kind: decoder
      output_mode: rgb

  conditional_student_decoder:
    backend: external
    factory: private_codec.factories:create_conditional_decoder
    checkpoint: null
    teacher_reference: auto
    kwargs:
      builder: private_codec.versions.v0.entrypoints:build_decoder
      runner: private_codec.versions.v0.entrypoints:run_decoder
      builder_kwargs: {}
      runner_kwargs: {}
    adapter:
      kind: decoder
      output_mode: rgb
      accepts_condition: true
