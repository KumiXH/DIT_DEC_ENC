# Complete single-file example: FlashVSR LQ_proj_in distillation with v0_proj_in.
# This file intentionally does not use `includes`.

latent_spec:
  family: wan_vae_v2
  channels: 16
  layout: BCHW
  spatial_downsample: 8
  temporal_downsample: 1
  normalization: wan_vae

color:
  matrix: bt709
  range: full
  packed_order: Y00Y01Y10Y11UV
  chroma_location: top_left
  chroma_upsample: nearest

recipe:
  name: flashvsr_lq_proj_distill
  weights:
    condition: 1.0
    condition_cos: 0.1
    condition_stat: 0.1

components:
  teacher_condition_encoder:
    backend: snapshot
    factory: distill_codec.integrations.snapshots:create_lq_proj_in
    kwargs:
      source_file: ../../third_party/flashvsr/utils.py
      checkpoint: ~/dit_codec/weights/LQ_proj_in.ckpt
      class_name: Causal_LQ4x_Proj
      in_dim: 3
      out_dim: 1536
      layer_num: 1
    freeze: true
    adapter:
      kind: condition_encoder
      temporal_frames: 5
      condition_spec: &lq_proj_contract
        family: flashvsr_lq_proj_v1_1
        layout: BNC
        feature_dim: 1536
        source: lq
        consumer: dit
        spatial_downsample: 16
        temporal_downsample: 5

  student_condition_encoder:
    backend: external
    factory: private_codec.versions.v0_proj_in.entrypoints:create_condition_encoder
    checkpoint: null
    kwargs:
      feature_channels: 32
      output_channels: 16
      unshuffle_factor: 2
      condition_dim: 1536
    adapter:
      kind: condition_encoder
      temporal_frames: 5
      condition_spec: *lq_proj_contract

data:
  lq_root: ~/dit_codec/LQ
  gt_root: ~/dit_codec/GT
  lq_size: [256, 256]
  gt_size: [256, 256]

trainer:
  device: cuda
  batch_size: 1
  learning_rate: 0.0001
  max_steps: 100000
  validate_every: 1000
  checkpoint_every: 1000
  num_workers: 4
  amp: true

run:
  output_dir: ~/dit_codec/runs/private_codec_lq_proj
  seed: 7
