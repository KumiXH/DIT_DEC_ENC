includes:
  - ../teachers/wan_snapshot.yaml
  - ../teachers/flashvsr_snapshot.yaml
  - ../students/private_codec.yaml

latent_spec:
  family: wan_vae_v2
  channels: 16
  layout: BCHW
  spatial_downsample: 8
  temporal_downsample: 1
  normalization: wan_vae

color:
  matrix: bt709
  range: full
  packed_order: Y00Y01Y10Y11UV
  chroma_location: top_left
  chroma_upsample: nearest

recipe:
  name: flashvsr_decoder_conditional_student
  weights:
    teacher: 1.0
    gt: 0.5
    edge: 0.1

latent_provider:
  type: teacher_encoder
  source: gt

data:
  lq_root: ~/dit_codec/LQ
  gt_root: ~/dit_codec/GT
  lq_size: [256, 256]
  gt_size: [256, 256]

trainer:
  device: cuda
  batch_size: 1
  learning_rate: 0.0001
  max_steps: 100000
  validate_every: 1000
  checkpoint_every: 1000
  num_workers: 4
  amp: true

run:
  output_dir: ~/dit_codec/runs/private_codec_conditional_decoder
  seed: 7
