includes:
  - ../students/private_codec.yaml

latent_spec:
  family: wan_vae_v2
  channels: 16
  layout: BCHW
  spatial_downsample: 8
  temporal_downsample: 1
  normalization: wan_vae

color:
  matrix: bt709
  range: full
  packed_order: Y00Y01Y10Y11UV
  chroma_location: top_left
  chroma_upsample: nearest

recipe:
  name: flashvsr_decoder_conditional_student
  weights:
    teacher: 1.0
    gt: 0.0
    edge: 0.1

latent_provider:
  type: cached
  root: ~/dit_codec/DIT_LATENT

teacher_target_provider:
  type: dataset_gt

data:
  lq_root: ~/dit_codec/LQ
  # In offline mode gt_root contains cached TCDecoder RGB targets, not true HQ GT.
  gt_root: ~/dit_codec/TCDECODER_RGB
  lq_size: [256, 256]
  gt_size: [256, 256]
  augmentation:
    enabled: false

trainer:
  device: cuda
  batch_size: 1
  learning_rate: 0.0001
  max_steps: 100000
  validate_every: 1000
  checkpoint_every: 1000
  num_workers: 4
  amp: true

run:
  output_dir: ~/dit_codec/runs/private_codec_conditional_decoder_offline
  seed: 7
