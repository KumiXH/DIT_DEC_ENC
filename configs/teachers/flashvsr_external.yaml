components:
  teacher_condition_encoder:
    backend: snapshot
    factory: distill_codec.integrations.snapshots:create_lq_proj_in
    kwargs:
      source_file: ../../third_party/flashvsr/utils.py
      checkpoint: D:/weights/LQ_proj_in.ckpt
      class_name: Causal_LQ4x_Proj
      in_dim: 3
      out_dim: 1536
      layer_num: 1
    freeze: true
    adapter: {kind: condition_encoder, temporal_frames: 3}
  tc_decoder:
    backend: snapshot
    factory: distill_codec.integrations.snapshots:create_tc_decoder
    kwargs:
      source_file: ../../third_party/flashvsr/TCDecoder.py
      checkpoint: D:/weights/TCDecoder.ckpt
      device: cuda
      dtype: bfloat16
      latent_channels: 784
    freeze: true
    adapter: {kind: decoder, output_mode: rgb, accepts_condition: true}
